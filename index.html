<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>웹오 서비스 상태</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f27; --sub: #4a5263; --line: #dfe3ea;
    --ok: #127a43; --ok-bg: #e6f4ec; --warn: #8a5a00; --warn-bg: #fdf2dc; --down: #b3261e; --down-bg: #fbe7e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --ink: #eef1f6; --sub: #b4bccb; --line: #2e3542;
      --ok: #5fd08f; --ok-bg: #173325; --warn: #f2c25b; --warn-bg: #3a2e12; --down: #ff8a80; --down-bg: #3d1a18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 24px; }
  .banner { border-radius: 12px; padding: 18px 20px; font-weight: 700; font-size: 1.125rem; margin-bottom: 24px; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .down { background: var(--down-bg); color: var(--down); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 20px; margin-bottom: 24px; }
  h2 { font-size: 1rem; margin: 16px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .state { font-weight: 700; white-space: nowrap; }
  .state.ok, .state.warn, .state.down { background: none; }
  .notice p { margin: 12px 0; }
  .meta { color: var(--sub); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <h1>웹오 서비스 상태</h1>
  <p class="lead">웹오 서버와 다른 곳에서 운영하는 페이지라, 웹오에 장애가 나도 이 페이지는 열립니다.</p>

  <!-- 상태를 바꿀 때는 아래 banner 줄의 class(ok·warn·down)와 문장만 고칩니다. -->
  <p class="banner ok" role="status">모든 서비스가 정상 운영 중입니다.</p>

  <section aria-labelledby="services">
    <h2 id="services">서비스별 상태</h2>
    <!-- 서비스마다 state 의 class(ok·warn·down)와 글자(정상·지연·장애·점검 중)를 같이 고칩니다. -->
    <ul>
      <li><span>매장 홈페이지</span><span class="state ok">정상</span></li>
      <li><span>사장님 관리 화면</span><span class="state ok">정상</span></li>
      <li><span>AI 제작·수정</span><span class="state ok">정상</span></li>
      <li><span>손님 상담 접수</span><span class="state ok">정상</span></li>
    </ul>
  </section>

  <section class="notice" aria-labelledby="notice">
    <h2 id="notice">공지</h2>
    <!-- 장애나 점검이 있으면 아래 문장을 바꾸고, 끝나면 복구 시각을 적어 둡니다. -->
    <p>현재 공지가 없습니다.</p>
  </section>

  <p class="meta">마지막 확인: <time datetime="2026-10-21T15:50+09:00">2026년 10월 21일 15:50 (한국 시간)</time></p>
</main>
</body>
</html>
